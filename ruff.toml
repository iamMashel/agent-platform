line-length = 100
target-version = "py312"

[lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["E501", "B008", "N805"]
exclude = [
    ".venv",
    ".git",
    "__pycache__",
    "apps/web",
    "uv.lock",
]

[lint.isort]
known-first-party = ["apps", "services", "src"]

[format]
quote-style = "double"
indent-style = "space"
