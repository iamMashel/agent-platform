repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff (lint)
        entry: uv run ruff check
        language: system
        types: [python]
        exclude: ^(\.venv|apps/web)/

      - id: ruff-format
        name: ruff (format)
        entry: uv run ruff format --check
        language: system
        types: [python]
        exclude: ^(\.venv|apps/web)/

      - id: pyright
        name: pyright (type check)
        entry: uv run pyright
        language: system
        pass_filenames: false
        exclude: ^(\.venv|apps/web)/
