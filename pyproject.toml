[project]
name = "agent-platform"
version = "0.1.0"
description = "Production-grade AI agent platform with orchestration, tracing, evals, and deployment guardrails"
readme = "README.md"
authors = [{ name = "Mashel Odera", email = "mashelodera1@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.28.0",
    "langchain>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langfuse>=2.0.0",
    "langgraph>=0.2.0",
    "prometheus-client>=0.21.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
    "duckduckgo-search>=7.0.0",
    "redis>=5.2.0",
    "slowapi>=0.1.9",
    "asyncpg>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.14.0",
    "langchain-openai>=0.3.0",
    "langchain-community>=0.3.0",
]

[project.scripts]
agent-platform = "agent_platform:main"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "pyright>=1.1.390",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "eval: requires a real LLM API key (deselect with '-m not eval')",
    "slow: marks tests as slow",
]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
exclude = ["uv.lock", ".venv", "apps/web"]
