name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pyright
      - name: Run Pytest
        run: uv run pytest
        env:
          GOOGLE_API_KEY: test
