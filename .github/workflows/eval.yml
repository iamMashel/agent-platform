name: Evals

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  eval:
    name: LLM Regression Evals
    runs-on: ubuntu-latest
    steps:
      - name: Skip — GOOGLE_API_KEY not configured
        if: ${{ secrets.GOOGLE_API_KEY == '' }}
        run: echo "GOOGLE_API_KEY secret not set — eval suite skipped."

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        if: ${{ secrets.GOOGLE_API_KEY != '' }}

      - uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb  # v5.4.1
        if: ${{ secrets.GOOGLE_API_KEY != '' }}
        with:
          enable-cache: true

      - name: Sync dependencies
        if: ${{ secrets.GOOGLE_API_KEY != '' }}
        run: uv sync --locked

      - name: Run eval suite
        if: ${{ secrets.GOOGLE_API_KEY != '' }}
        run: uv run pytest tests/evals -v -m eval --tb=short
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
