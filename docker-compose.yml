name: agent-platform

services:
  # ── API ─────────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    image: agent-platform/api:local
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      LANGFUSE_HOST: http://langfuse:3000
      ENVIRONMENT: production
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://agent:agent@agentdb:5432/agent
    depends_on:
      agentdb:
        condition: service_healthy
      redis:
        condition: service_healthy
      langfuse:
        condition: service_started
    restart: unless-stopped
    networks:
      - agent-net
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  # ── Frontend ─────────────────────────────────────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    image: agent-platform/web:local
    ports:
      - "3002:3000"
    environment:
      NUXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - agent-net

  # ── Redis (session memory + caching) ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - agent-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Agent Postgres (run history) ─────────────────────────────────────────────
  agentdb:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent
    volumes:
      - agentdb_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - agent-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Langfuse LLM observability ───────────────────────────────────────────────
  langfuse:
    image: langfuse/langfuse:2
    ports:
      - "3010:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfusedb:5432/langfuse
      NEXTAUTH_SECRET: changethis_dev_secret_32chars_min
      SALT: changethis_dev_salt
      NEXTAUTH_URL: http://localhost:3010
      TELEMETRY_ENABLED: "false"
    depends_on:
      langfusedb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - agent-net

  # ── Langfuse Postgres ────────────────────────────────────────────────────────
  langfusedb:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfusedb_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - agent-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Prometheus metrics ───────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    restart: unless-stopped
    networks:
      - agent-net

  # ── Grafana dashboards ───────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - agent-net

networks:
  agent-net:
    driver: bridge

volumes:
  redis_data:
  agentdb_data:
  langfusedb_data:
  grafana_data:
